packages:
  - 'packages/*'

strictDepBuilds: true

# eslint-plugin-react has not declared ESLint 10 support in its peer range (it caps at ^9.7),
# but it works under ESLint 10 (its version detection is pinned in createReactConfig to dodge
# the one removed-API crash). Accept ESLint 10 so the peer check stays clean. Consumers of
# @lagetech/eslint-config-react need the same rule.
peerDependencyRules:
  allowedVersions:
    'eslint-plugin-react>eslint': '10'

catalog:
  typescript: '^6.0.3'
  zod: '^4.4.3'
  '@types/node': '^25.9.1'
  tsup: '^8.5.1'
  tsx: '^4.22.4'
  globals: '^17.6.0'

catalogs:
  linting:
    eslint: '^10.4.1'
    jiti: '^2.7.0'
    prettier: '^3.8.3'
  testing:
    vitest: '^3.2.6' # was 4.1.8 - v4 needs Vite ≥6, which VitePress 1.x can't provide

allowBuilds:
  unrs-resolver: true
